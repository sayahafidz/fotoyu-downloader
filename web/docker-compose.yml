# Fotoyu Downloader — self-hosted with Docker + Caddy (auto HTTPS)
#
# Usage:
#   1. Copy .env.example to .env, edit NEXT_PUBLIC_APP_URL.
#   2. Edit Caddyfile, replace fotoyu.example.com with your domain.
#   3. docker compose up -d --build
#
# Caddy will auto-provision a Let's Encrypt TLS certificate for your domain.
# Make sure your domain's A/AAAA DNS records point to this server before
# starting, otherwise the TLS challenge will fail.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fotoyu-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DEWATERMARK_API_KEY: ${DEWATERMARK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-image-1}
      OPENAI_API_MODE: ${OPENAI_API_MODE:-edits}
      PROVIDER_IMAGE_ORIGINS: ${PROVIDER_IMAGE_ORIGINS:-}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
      APP_ORIGIN: https://${APP_DOMAIN:-fotoyu.example.com}
      WATERMARK_CONCURRENCY: ${WATERMARK_CONCURRENCY:-2}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      redis:
        condition: service_healthy
    # Do not publish port directly; Caddy proxies to it on the internal
    # docker network. If you want to skip Caddy, uncomment the lines below.
    # ports:
    #   - "3000:3000"
    networks:
      - fotoyu-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks:
      - fotoyu-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: fotoyu-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Used inside Caddyfile via {$APP_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN:-fotoyu.example.com}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - fotoyu-net

networks:
  fotoyu-net:
    driver: bridge

volumes:
  redis_data:
  caddy_data:
  caddy_config:
